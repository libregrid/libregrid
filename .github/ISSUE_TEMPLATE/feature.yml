name: Feature request
description: Request a new feature or enhancement
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which package or surface does this belong to?
      options:
        - core / material
        - menu / side-bar / toolbar / status-bar
        - row-grouping / columns-tool-panel / pivot
        - cell-selection / clipboard
        - excel-export
        - set-filter / multi-filter / filters-tool-panel / advanced-filter
        - server-side-row-model / viewport-row-model
        - tree-data / master-detail
        - find / rich-select
        - integrated-charts / sparklines
        - angular / docs
        - tooling / CI / release
        - other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What feature and why
    validations:
      required: true
