name: Bug report
description: Something is broken or behaves incorrectly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LibreGrid version
      description: Package versions you are using (e.g. @libregrid/core@0.1.0)
    validations:
      required: true
  - type: input
    id: ag-grid-version
    attributes:
      label: ag-grid-community version
      description: e.g. 36.1.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, what you expected, and how to reproduce it
    validations:
      required: true
