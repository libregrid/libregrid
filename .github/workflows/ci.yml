name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Contamination job runs first and blocks every other job.
# See docs/reference/guardrails.md G1 and docs/adr/0004-contamination-controls.md.
jobs:
  # Skips e2e and phase-gates when a push/PR touches only Markdown, LICENSE,
  # NOTICE, or changeset files — nothing behavioral those jobs would catch.
  # lint-test-build still runs unconditionally: check:budgets validates the
  # README disclaimer and LICENSE/NOTICE presence, which IS what changes in
  # a docs-only push. A skipped job counts as a pass for the workflow's
  # overall conclusion, so release.yml's CI-must-succeed gate is unaffected.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether this change is docs-only
        id: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit (new branch or first push) — running full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"
          # Deliberately not `grep -qv` here: combined with -v it can give
          # order-dependent results on some grep implementations. Capture the
          # actual non-doc lines and check whether any exist instead.
          NON_DOC=$(echo "$CHANGED" | grep -vE '\.md$|(^|/)LICENSE$|(^|/)NOTICE$|^\.changeset/.*\.md$' | grep -v '^$' || true)
          if [ -n "$NON_DOC" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: G1 contamination check
        run: node tools/check-contamination/bin.mjs
      - name: G1 guard test (proved-to-fire fixture)
        run: npx vitest run tools/check-contamination/bin.spec.ts --reporter verbose

  lint-test-build:
    needs: contamination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gen:version
      - name: Check generated files are committed
        run: git diff --exit-code
      - name: Lint
        run: npx nx run-many -t lint
      - name: Version checks
        run: npm run check:versions
      - name: Test (with coverage)
        run: npx vitest run --coverage --reporter verbose
      - name: Build
        run: npx nx run-many -t build
      - name: Bundle budget check
        run: npm run check:budgets

  e2e:
    needs: [lint-test-build, detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright E2E and axe (Chromium, Firefox, WebKit)
        run: NX_DAEMON=false npx nx e2e docs-e2e

  phase-gates:
    needs: [lint-test-build, detect-changes]
    if: needs.detect-changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Community conformance matrix
        run: NX_DAEMON=false npx nx run conformance:matrix
      - name: Benchmark comparison
        # Non-blocking for now: comparing against a same-run baseline on shared
        # GitHub Actions runners produces regression numbers dominated by
        # runner noise, not real perf changes. Revisit once there's a stable
        # baseline strategy (e.g. a dedicated runner or multi-run averaging)
        # worth gating merges on.
        continue-on-error: true
        run: NX_DAEMON=false npx nx run bench:compare
