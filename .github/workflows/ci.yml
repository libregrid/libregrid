name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Contamination job runs first and blocks every other job.
# See docs/reference/guardrails.md G1 and docs/adr/0004-contamination-controls.md.
jobs:
  # Decides whether the expensive e2e / phase-gate jobs should run.
  # lint-test-build still runs unconditionally (budgets, versions, G1).
  #
  # skip_e2e is true when:
  #   - docs/changeset-only (no behavioral code)
  #   - version-only release PR (package.json + CHANGELOG bumps)
  #   - the Changesets release branch itself
  # e2e also only runs on pull_request — a green PR already covered the same
  # tree, so re-running the full browser matrix on every main push (and again
  # on the version PR) wastes ~20 minutes three times per change.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      skip_e2e: ${{ steps.check.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine whether expensive jobs can be skipped
        id: check
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Push to main: PR already ran e2e. Release only needs lint-test-build green.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "push to main — skip e2e/phase-gates (covered by the merged PR)."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Changesets version PR: package.json + CHANGELOG only. No UI change.
          if [ "$HEAD_REF" = "changeset-release/main" ]; then
            echo "changeset-release/main — skip e2e/phase-gates."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base commit (new branch or first push) — full CI."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          # Docs / license / changeset files only.
          NON_DOC=$(echo "$CHANGED" | grep -vE '\.md$|(^|/)LICENSE$|(^|/)NOTICE$|^\.changeset/' | grep -v '^$' || true)
          if [ -z "$NON_DOC" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Version-only: package.json bumps and changelogs (no source).
          NON_VERSION=$(echo "$CHANGED" | grep -vE '\.md$|(^|/)LICENSE$|(^|/)NOTICE$|^\.changeset/|(^|/)package\.json$' | grep -v '^$' || true)
          if [ -z "$NON_VERSION" ]; then
            echo "version-only change set — skip e2e/phase-gates."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "skip_e2e=false" >> "$GITHUB_OUTPUT"

  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: G1 contamination check
        run: node tools/check-contamination/bin.mjs
      - name: G1 guard test (proved-to-fire fixture)
        run: npx vitest run tools/check-contamination/bin.spec.ts --reporter verbose

  lint-test-build:
    needs: contamination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gen:version
      - name: Check generated files are committed
        run: git diff --exit-code
      - name: Lint
        run: npx nx run-many -t lint
      - name: Version checks
        run: npm run check:versions
      - name: Test (with coverage)
        run: npx vitest run --coverage --reporter verbose
      - name: Build
        run: npx nx run-many -t build
      - name: Bundle budget check
        run: npm run check:budgets

  e2e:
    needs: [lint-test-build, detect-changes]
    if: needs.detect-changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: Playwright E2E and axe (Chromium, Firefox, WebKit)
        run: NX_DAEMON=false npx nx e2e docs-e2e

  phase-gates:
    needs: [lint-test-build, detect-changes]
    if: needs.detect-changes.outputs.skip_e2e != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Community conformance matrix
        run: NX_DAEMON=false npx nx run conformance:matrix
      - name: Benchmark comparison
        # Non-blocking for now: comparing against a same-run baseline on shared
        # GitHub Actions runners produces regression numbers dominated by
        # runner noise, not real perf changes. Revisit once there's a stable
        # baseline strategy (e.g. a dedicated runner or multi-run averaging)
        # worth gating merges on.
        continue-on-error: true
        run: NX_DAEMON=false npx nx run bench:compare
