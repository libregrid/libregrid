name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Contamination job runs first and blocks every other job.
# See docs/reference/guardrails.md G1 and docs/adr/0004-contamination-controls.md.
jobs:
  contamination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: G1 contamination check
        run: node tools/check-contamination/bin.mjs
      - name: G1 guard test (proved-to-fire fixture)
        run: npx vitest run tools/check-contamination/bin.spec.ts --reporter verbose

  lint-test-build:
    needs: contamination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gen:version
      - name: Check generated files are committed
        run: git diff --exit-code
      - name: Lint
        run: npx nx run-many -t lint
      - name: Version checks
        run: npm run check:versions
      - name: Test (with coverage)
        run: npx vitest run --coverage --reporter verbose
      - name: Build
        run: npx nx run-many -t build
      - name: Bundle budget check
        run: npm run check:budgets

  e2e:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright E2E and axe (Chromium, Firefox, WebKit)
        run: NX_DAEMON=false npx nx e2e docs-e2e

  phase-gates:
    needs: lint-test-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Community conformance matrix
        run: NX_DAEMON=false npx nx run conformance:matrix
      - name: Benchmark comparison
        run: NX_DAEMON=false npx nx run bench:compare
