name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # Guardrail G1. Runs first, standalone, and blocks everything else.
  # LibreGrid's legal standing depends on this. See docs/reference/guardrails.md
  # ───────────────────────────────────────────────────────────────────────
  contamination:
    name: G1 contamination guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Step names are scanned too — keep the forbidden term out of labels.
      - name: Guardrail G1 — no commercial package references
        run: npm run check:contamination
      - name: Guard is proven to fire
        # A guard never observed failing is not a guard.
        run: npx vitest run tools/check-contamination --reporter=basic

  verify:
    name: Lint, test & build
    needs: contamination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate VERSION from installed ag-grid-community
        run: npm run gen:version
      - name: Version drift & core singleton
        run: npm run check:versions
      - name: Test
        run: npx vitest run --coverage --reporter=basic
      - name: Build
        run: npm run build
      - name: Fail if generated files drifted
        run: git diff --exit-code

  # ───────────────────────────────────────────────────────────────────────
  # G5 tripwire. The @internal seams carry no stability promise, so a
  # Community release can break us. Nightly, across the supported range.
  # ───────────────────────────────────────────────────────────────────────
  conformance:
    name: Seam conformance (ag-grid-community ${{ matrix.ag-grid }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ag-grid: ['36.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pin ag-grid-community
        run: npm install --no-save ag-grid-community@${{ matrix.ag-grid }}
      - run: npm run gen:version
      - name: Seam verification
        run: npx vitest run packages/core --reporter=basic
