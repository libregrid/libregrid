name: Nightly

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gen:version
      - name: Seam verification (G5 tripwire)
        run: npx vitest run packages/core/src/seams.spec.ts --reporter verbose
      - name: Conformance matrix
        run: node tools/conformance/matrix.mjs
