name: Nightly

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run gen:version
      - name: Seam verification (G5 tripwire)
        run: npx vitest run packages/core/src/seams.spec.ts --reporter verbose
      - name: Conformance matrix
        run: node tools/conformance/matrix.mjs

  # Moved off the PR path: this collects a full benchmark run (compare.mjs
  # shells out to `nx run bench:bench` when no current results exist), which
  # cost ~6 minutes on every PR while `continue-on-error: true` discarded the
  # verdict. Nightly runs it for real — a >5% regression fails the job.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Benchmark comparison
        run: NX_DAEMON=false npx nx run bench:compare
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: apps/bench/bench/results/
          retention-days: 14
          if-no-files-found: ignore
