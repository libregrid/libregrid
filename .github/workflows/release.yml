name: Release

on:
  # Manual only. Releases are intentional and batched across merged PRs —
  # changesets accumulate until a maintainer runs this workflow. See
  # docs/design/release-versioning-plan.md (Option A).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the whole release path without publishing anything'
        type: boolean
        default: false
      allow_new_packages:
        description: 'Permit creating package names that are not yet on the registry'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately no registry-url. That input makes setup-node write an
      # .npmrc holding `_authToken=${NODE_AUTH_TOKEN}`, and npm then sends that
      # value instead of exchanging the OIDC token — which with no token set
      # means publishing with setup-node's XXXXX placeholder and getting E404 on
      # every package (run 33020093899). Publishing here is tokenless: all 36
      # packages trust this workflow, verified by run 33035340700.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles 10.9.x, which
      # has no OIDC support at all and publishes unauthenticated. Pinned to the
      # 11 line rather than @latest: npm 12 blocks package lifecycle scripts
      # unless allowScripts covers them, which breaks the build (run
      # 33023063903). Moving to npm 12 is a deliberate migration.
      - run: npm install -g npm@11

      - run: npm ci

      # Dry run stops here, having exercised install, preflight, lint, test,
      # build and every budget gate — everything except the publish itself.
      - name: Validate release (dry run)
        if: ${{ inputs.dry_run }}
        run: npm run release:dry
        env:
          ALLOW_NEW_PACKAGES: ${{ inputs.allow_new_packages }}

      # v2.1.1+: detects published packages via the CLI's CHANGESETS_OUTPUT
      # file — action v1 parsed stdout for "New tag:" lines, which the
      # changesets v3 CLI no longer prints, silently disabling the published
      # output and its own release creation.
      - name: Create version PR or publish packages
        id: changesets
        if: ${{ !inputs.dry_run }}
        uses: changesets/action@v2.1.1
        with:
          # Must be a single command — the action does not run this through a
          # shell, so && chains arrive as literal args. version:packages bumps
          # the lockstep versions, then mirrors them into the private manifests
          # (root + docs) and regenerates the docs version badge, so the
          # Version Packages PR carries every version field in one commit.
          version-script: npm run version:packages
          # `release` runs the preflight before the verify gate, so a dead
          # credential or an uncreatable package name fails in seconds and
          # before a single package is published. changesets has no rollback:
          # on 2026-08-26 it published 1 of 36 and then stopped, leaving the
          # lockstep group split across two versions on the registry.
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # One curated release per lockstep version, not 32 per-package ones.
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # A package that is not on the registry yet cannot have a trusted
          # publisher, so its first publish needs a token that this workflow no
          # longer carries. Publish it once by hand, run `npm run trust:setup`,
          # and every release after that is tokenless again.
          ALLOW_NEW_PACKAGES: ${{ inputs.allow_new_packages }}

      # Self-sufficient: creates the tag + GitHub Release whenever the lockstep
      # version is on npm but has no tag yet — on a normal publish, on a
      # re-run after a partial failure, and not at all during the version-PR
      # stage (the bumped version is not on npm yet).
      - name: Tag and publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — nothing to do."
            exit 0
          fi
          if ! npm view "@libregrid/core@$VERSION" version > /dev/null 2>&1; then
            echo "v$VERSION is not on npm yet (version PR stage) — skipping."
            exit 0
          fi
          node tools/version/release-notes.mjs > release-notes.md
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "LibreGrid v$VERSION" \
            --notes-file release-notes.md
