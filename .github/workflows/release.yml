name: Release

on:
  # Manual only. Releases are intentional and batched across merged PRs —
  # changesets accumulate until a maintainer runs this workflow. See
  # docs/design/release-versioning-plan.md (Option A).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # registry-url makes setup-node write an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}`. It is here only for the 1.3.0
      # bootstrap: the four new @libregrid/ai-* packages are not on the
      # registry yet, and npm only accepts a trusted-publisher config for a
      # package that already exists, so their first version needs NPM_TOKEN.
      # BOOTSTRAP ONLY — delete this input, and NODE_AUTH_TOKEN below, once the
      # ai-* packages are published and have trusted-publisher configs.
      # Leaving it with no token set is worse than useless: NODE_AUTH_TOKEN
      # expands to setup-node's XXXXX placeholder, npm sends that junk
      # credential instead of exchanging the OIDC token, and every publish
      # comes back E404 (run 33020093899).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles 10.9.x,
      # which has no OIDC support at all and publishes unauthenticated.
      - run: npm install -g npm@latest

      - run: npm ci

      # v2.1.1+: detects published packages via the CLI's CHANGESETS_OUTPUT
      # file — action v1 parsed stdout for "New tag:" lines, which the
      # changesets v3 CLI no longer prints, silently disabling the published
      # output and its own release creation.
      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v2.1.1
        with:
          # Must be a single command — the action does not run this through a
          # shell, so && chains arrive as literal args. version:packages bumps
          # the lockstep versions, then mirrors them into the private manifests
          # (root + docs) and regenerates the docs version badge, so the
          # Version Packages PR carries every version field in one commit.
          version-script: npm run version:packages
          publish-script: npm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
          # One curated release per lockstep version, not 32 per-package ones.
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Every already-published @libregrid/* package trusts this workflow
          # via an npm trusted-publisher config (id-token: write above). npm
          # >= 11.5.1 detects the OIDC environment and exchanges it for a
          # short-lived publish credential, falling back to this token only
          # where no trusted publisher exists — which for 1.3.0 means just the
          # four new ai-* packages. BOOTSTRAP ONLY: remove with registry-url.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Self-sufficient: creates the tag + GitHub Release whenever the lockstep
      # version is on npm but has no tag yet — on a normal publish, on a
      # re-run after a partial failure, and not at all during the version-PR
      # stage (the bumped version is not on npm yet).
      - name: Tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists — nothing to do."
            exit 0
          fi
          if ! npm view "@libregrid/core@$VERSION" version > /dev/null 2>&1; then
            echo "v$VERSION is not on npm yet (version PR stage) — skipping."
            exit 0
          fi
          node tools/version/release-notes.mjs > release-notes.md
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "LibreGrid v$VERSION" \
            --notes-file release-notes.md
