name: Release

on:
  # Manual only. Releases are intentional and batched across merged PRs —
  # changesets accumulate until a maintainer runs this workflow. See
  # docs/design/release-versioning-plan.md (Option A).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Create version PR or publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          # After the lockstep bump, mirror it into the private manifests
          # (root + docs) and regenerate the docs version badge so the
          # Version Packages PR carries every version field in one commit.
          version: npx changeset version && npm run sync:version && node tools/version/workspace.mjs generate
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for the initial publish. Once every package has an npm
          # trusted-publisher configuration, this secret can be removed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Changesets invokes npm itself; this npm config flag creates
          # provenance attestations, including for a package's first release.
          NPM_CONFIG_PROVENANCE: 'true'

      # Changesets publishes to npm but creates no tag or GitHub Release.
      # Every release must leave that trail so npm, the repo, and the docs
      # badge can never drift apart silently again.
      - name: Tag and publish GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          node tools/version/release-notes.mjs > release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "LibreGrid v$VERSION" --notes-file release-notes.md
