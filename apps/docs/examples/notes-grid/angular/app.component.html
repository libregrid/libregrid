<div>
  <ag-grid-angular
    style="height: 420px; width: 100%"
    [theme]="theme"
    [columnDefs]="columnDefs"
    [rowData]="rows"
    [gridOptions]="gridOptions"
    (gridReady)="onGridReady($event.api)"
  />
</div>

<h2>Options</h2>
<div>
  <button [class.lgr-active]="trigger() !== 'hover'" (click)="toggleTrigger()">
    {{ trigger() === 'hover' ? 'noteTrigger: hover' : 'noteTrigger: click' }}
  </button>
  <button (click)="addNoteToFirstRow()">Add note to first row</button>
  <button (click)="clearAllNotes()">Clear all notes</button>
</div>
