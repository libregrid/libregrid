<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Side Bar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <button id="action-0" type="button">Toggle side bar</button>
    <button id="action-1" type="button">Open columns panel</button>
    <button id="action-2" type="button">Open filters panel</button>
    <button id="action-3" type="button">Close panel</button>
    <button id="action-4" type="button">Left</button>
    <button id="action-5" type="button">Right</button>
    <button id="action-6" type="button">Hide panel buttons</button>
    <button id="action-7" type="button">Show panel buttons</button>
    <p id="status-isVisible" role="status"></p>
    <p id="status-openPanelId" role="status"></p>
    <p id="status-buttonsHidden" role="status"></p>
    <div id="grid" style="height: 420px"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
